name: Validate Padua VTE tools

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: ci-test-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and optional API dependencies
        run: python -m pip install pytest "pydantic>=2,<3" fastapi uvicorn httpx
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build Docker CLI image
        if: matrix.python-version == '3.12'
        run: docker build -t padua-vte:test .
      - name: Verify CLI
        run: |
          python cli.py --json assess --active-cancer --age-70-or-older
          python cli.py verify-audit
          python -m pip check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser calculator parity
        run: node --test web/app.test.js
